
<!-- 成長進度儀表板 -->
<div class="dashboard">
    <div class="dashboard-label">✦ 整體成長進度</div>

    <div class="gauge">
        <svg viewBox="0 0 300 190">
            <defs>
                <linearGradient id="gaugeGradient"
                    x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#b9a5f5"/>
                    <stop offset="100%" stop-color="#8064d5"/>
                </linearGradient>
            </defs>

            <!-- 背景刻度弧 -->
            <path
                d="M 35 155 A 115 115 0 0 1 265 155"
                fill="none"
                stroke="#e5def5"
                stroke-width="15"
                stroke-linecap="round"
            />

            <!-- 進度弧 -->
            <path
                id="gaugeProgress"
                d="M 35 155 A 115 115 0 0 1 265 155"
                fill="none"
                stroke="url(#gaugeGradient)"
                stroke-width="15"
                stroke-linecap="round"
                pathLength="100"
                stroke-dasharray="0 100"
            />

            <!-- 指針 -->
            <line
                id="gaugeNeedle"
                x1="150" y1="155"
                x2="150" y2="48"
                stroke="#6550a8"
                stroke-width="4"
                stroke-linecap="round"
                transform="rotate(-90 150 155)"
            />

            <!-- 指針中心 -->
            <circle cx="150" cy="155" r="10"
                fill="#6550a8"/>
            <circle cx="150" cy="155" r="4"
                fill="#ffffff"/>

            <!-- 刻度標示 -->
            <text x="27" y="178" font-size="12"
                fill="#9a91b4">0%</text>
            <text x="150" y="25" text-anchor="middle"
                font-size="12" fill="#9a91b4">50%</text>
            <text x="273" y="178" text-anchor="end"
                font-size="12" fill="#9a91b4">100%</text>
        </svg>

        <div class="gauge-value">
            <span id="progressPercent">0%</span>
        </div>
    </div>

    <div class="progress-detail" id="progressDetail"></div>
</div>

<style>
.dashboard {
    padding: 23px 15px 20px;
    margin-bottom: 18px;
    border-radius: 20px;
    background: linear-gradient(135deg,#eeeaff,#f7f2ff);
    border: 1px solid #e6defc;
}

.dashboard-label {
    color: #7765aa;
    font-size: .9rem;
    font-weight: 700;
    margin-bottom: 5px;
}

.gauge {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
}

.gauge svg {
    display: block;
    width: 100%;
    overflow: visible;
}

#gaugeProgress {
    transition: stroke-dasharray 1.2s ease;
}

#gaugeNeedle {
    transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.gauge-value {
    position: absolute;
    left: 0;
    right: 0;
    top: 65%;
    transform: translateY(-50%);
    text-align: center;
    font-size: 2.6rem;
    font-weight: 900;
    color: #7761c8;
    font-variant-numeric: tabular-nums;
}

.progress-detail {
    margin-top: -5px;
    font-size: .85rem;
    color: #887ba9;
    font-weight: 600;
}
</style>

<script>
// 將原本儀表板寫入部分替換成這段

const progress = Math.min(
    100,
    Math.max(0, finalPaid / totalMonths * 100)
);

// 更新百分比
document.getElementById('progressPercent').innerText =
    progress.toFixed(1) + "%";

// 更新月份
document.getElementById('progressDetail').innerText =
    finalPaid + " / " + totalMonths + " 個月";

// 更新進度弧
document.getElementById('gaugeProgress').setAttribute(
    'stroke-dasharray',
    progress + ' 100'
);

// 更新指針角度：-90度至90度
document.getElementById('gaugeNeedle').setAttribute(
    'transform',
    'rotate(' + (-90 + progress * 1.8) + ' 150 155)'
);
</script>
