
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f2ff">
<title>ㄅ一的成長進度追蹤</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    background:
        radial-gradient(circle at 10% 10%, #e8e3ff, transparent 40%),
        radial-gradient(circle at 90% 90%, #ffe9ef, transparent 40%),
        #f8f9ff;
    color: #344054;
}

.container {
    width: 100%;
    max-width: 410px;
    padding: 30px 25px;
    border-radius: 28px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 20px 60px rgba(75,65,120,.12);
    text-align: center;
}

.header-icon {
    font-size: 32px;
    margin-bottom: 12px;
}

h2 {
    margin: 0 0 8px;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: #39435d;
}

.subtitle {
    color: #9aa1b5;
    font-size: .85rem;
    margin-bottom: 25px;
}

/* 儀表板 */
.dashboard {
    padding: 23px 18px;
    margin-bottom: 18px;
    border-radius: 20px;
    background: linear-gradient(135deg,#eeeaff,#f7f2ff);
    border: 1px solid #e6defc;
}

.dashboard-label {
    color: #7765aa;
    font-size: .9rem;
    font-weight: 700;
}

.progress-percent {
    font-size: 2.8rem;
    font-weight: 900;
    color: #7761c8;
    margin: 10px 0;
    font-variant-numeric: tabular-nums;
}

.progress-track {
    width: 100%;
    height: 13px;
    background: #ddd7f0;
    border-radius: 20px;
    overflow: hidden;
    margin: 15px 0 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: linear-gradient(90deg,#a58be9,#8064d5);
    transition: width 1s ease;
}

.progress-detail {
    font-size: .82rem;
    color: #887ba9;
}

/* 資訊卡 */
.stat-box {
    padding: 22px 15px;
    border-radius: 19px;
    margin-bottom: 15px;
}

.paid {
    background: linear-gradient(135deg,#e5f9ed,#f1fff5);
    color: #268451;
    border: 1px solid #d4f0df;
}

.countdown {
    background: linear-gradient(135deg,#fff0e4,#fff8f0);
    color: #d66a32;
    border: 1px solid #ffe4cf;
}

.label {
    display: block;
    font-size: .9rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.number {
    display: block;
    font-size: 2.5rem;
    font-weight: 900;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
}

.amount {
    display: block;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(38,132,81,.18);
    font-size: 1.45rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

.amount-note {
    display: block;
    font-size: .78rem;
    margin-top: 5px;
    opacity: .75;
}

.sub-text {
    display: block;
    margin-top: 10px;
    font-size: .9rem;
    font-weight: 600;
    opacity: .8;
}

.footer {
    margin-top: 20px;
    color: #a4a9b9;
    font-size: .72rem;
    letter-spacing: 1px;
}

@media(max-width:420px) {
    .container { padding: 25px 18px; }
    .number { font-size: 2.3rem; }
}
</style>
</head>

<body>

<div class="container">

    <div class="header-icon">🌱</div>
    <h2>成長進度監測</h2>
    <div class="subtitle">每一個月，都是成長的累積</div>

    <!-- 成長進度儀表板 -->
    <div class="dashboard">
        <div class="dashboard-label">✦ 整體成長進度</div>
        <div class="progress-percent" id="progressPercent">0%</div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress-detail" id="progressDetail"></div>
    </div>

    <!-- 已支付 -->
    <div class="stat-box paid">
        <span class="label">✦ 已支付</span>
        <span class="number" id="paidMonths"></span>

        <span class="amount" id="totalAmount"></span>
        <span class="amount-note">每月 NT$5,000 × 已支付月份</span>
    </div>

    <!-- 成年倒數 -->
    <div class="stat-box countdown">
        <span class="label">✦ 倒數成年</span>
        <span class="number" id="remainingMonths"></span>
        <span id="remainingYears" class="sub-text"></span>
    </div>

    <div class="footer">
        EVERY MONTH IS A NEW MILESTONE
    </div>

</div>

<script>
window.onload = function() {

    const now = new Date();
    const curY = now.getFullYear();
    const curM = now.getMonth();
    const curD = now.getDate();

    // 原始日期參數
    const startY = 2025;
    const startM = 3;
    const adultY = 2034;
    const adultM = 7;

    // 每月支付基數
    const monthlyAmount = 5000;

    // 已支付計算
    let monthsPassed =
        (curY - startY) * 12 + (curM - startM);

    let finalPaid = monthsPassed;

    if (curD >= 20) {
        finalPaid += 1;
    }

    // 成年倒數計算
    let monthsRemaining =
        (adultY - curY) * 12 + (adultM - curM);

    if (curD >= 20) {
        monthsRemaining -= 1;
    }

    // 安全限制
    if (finalPaid < 0) finalPaid = 0;
    if (monthsRemaining < 0) monthsRemaining = 0;

    const y = Math.floor(monthsRemaining / 12);
    const m = monthsRemaining % 12;

    // 累積支付金額
    const totalAmount = finalPaid * monthlyAmount;

    // 總月份
    const totalMonths =
        (adultY - startY) * 12 + (adultM - startM);

    // 成長進度
    const progress = Math.min(
        100,
        Math.max(0, finalPaid / totalMonths * 100)
    );

    // 寫入已支付月份
    document.getElementById('paidMonths').innerText =
        finalPaid + " 個月";

    // 寫入累積金額
    document.getElementById('totalAmount').innerText =
        "NT$ " + totalAmount.toLocaleString('en-US');

    // 寫入成年倒數
    document.getElementById('remainingMonths').innerText =
        monthsRemaining + " 個月";

    if (monthsRemaining > 0) {
        document.getElementById('remainingYears').innerText =
            "(" + y + " 年 " + m + " 個月)";
    } else {
        document.getElementById('remainingYears').innerText =
            "(已成年)";
    }

    // 寫入儀表板
    document.getElementById('progressPercent').innerText =
        progress.toFixed(1) + "%";

    document.getElementById('progressDetail').innerText =
        finalPaid + " / " + totalMonths + " 個月";

    document.getElementById('progressFill').style.width =
        progress + "%";
};
</script>

</body>
</html>
